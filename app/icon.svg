  <rect x="4" y="4" width="24" height="24" rx="6.5" fill="none" stroke="#C8FF00" stroke-width="3.4"/>
  <path d="M11 21 21 11" stroke="#C8FF00" stroke-width="3.4" stroke-linecap="round"/>
</svg>
