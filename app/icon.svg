<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <!-- The mark from components/Nav.jsx, scaled 24 -> 32 and given the black
       field the site is always designed on. Proportions match the PWA icons in
       public/icons, so the tab, the home screen and the install prompt all show
       the same thing. -->
